name: Build OmniModel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firefox manifest
        run: python -c "import json; m=json.load(open('manifest.json')); assert m['manifest_version']==3; assert m['background'].get('scripts') == ['background.js']"
      - name: Package Firefox and Chrome builds
        run: |
          mkdir -p dist/firefox dist/chrome
          files="background.js content.js content.css pixel.css popup.html popup.js chat.html chat.js README.md"
          cp manifest.json dist/firefox/manifest.json
          for file in $files; do cp "$file" dist/firefox/; done
          cp -r dist/firefox/. dist/chrome/
          python - <<'PY'
          import json
          path = "dist/chrome/manifest.json"
          data = json.load(open(path))
          data["background"] = {"service_worker": "background.js"}
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          (cd dist/firefox && zip -r ../omnimodel-firefox.zip .)
          (cd dist/chrome && zip -r ../omnimodel-chrome.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: omnimodel-browser-builds
          path: dist/*.zip
          if-no-files-found: error
